plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace "com.moko.ble.lib"
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.0.2-beacon-multiple"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }

    // 声明发布 release 变体
    publishing {
        singleVariant('release') {
            withSourcesJar() // 可选：与源码包 Task 合并
        }
    }
}

publishing {
    repositories {
        mavenLocal()
    }

    // publications 用于定义发布任务的配置块
    publications {
        // 这个 aarAndroid 可以随便填，只是一个任务名字而已
        // MavenPublication必须有，这个是调用的任务类
        aarAndroid(MavenPublication) {
            // 这里头是artifacts的配置信息，不填会采用默认的
            groupId = 'com.github.MOKO-Android-Base-Library'
            artifactId = 'MKBleLib'
            version = '1.0.2-beacon-multiple'

            afterEvaluate {
                // 使用 release 变体的组件（自动包含依赖信息）
                from components.release
            }
        }
    }
}

dependencies {
    api 'no.nordicsemi.android.support.v18:scanner:1.6.0'
    api 'no.nordicsemi.android:ble:2.7.3'
    api 'org.greenrobot:eventbus:3.3.1'
    api 'com.elvishew:xlog:1.6.1'
    api 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.0.0'
}

//修改jar名字+将指定jar生成的地方
task makeJar(type: Copy) {
    //如果之前存在，则先删除
    delete 'build/libs/mokoBleLib.jar'
    //设置拷贝的文件
    from('build/intermediates/aar_main_jar/debug/')
    //生成jar包后的文件目录位置
    into('build/libs/')
    //include,exclude参数来设置过滤
    include('classes.jar')
    //重命名
    rename('classes.jar', 'mokoBleLib.jar')
}

makeJar.dependsOn(build)
